name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: cargo publish (lockstep, dependency order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace builds and tests
        run: cargo test --workspace --all-features

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Lockstep versioning: publish leaves before dependents. A short delay
        # between publishes lets the crates.io index refresh so dependent crates
        # can resolve the just-published version.
        run: |
          set -euo pipefail
          publish_one() {
            local crate="$1"
            echo "::group::publish $crate"
            # Retry a few times to absorb index propagation lag.
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"; then
                echo "::endgroup::"
                return 0
              fi
              echo "retry $attempt for $crate (index lag?)"
              sleep 20
            done
            echo "::endgroup::"
            echo "failed to publish $crate"
            exit 1
          }
          publish_one tpt-telemetry-schema
          sleep 20
          publish_one tpt-grok-engine
          sleep 20
          publish_one tpt-telemetry-compiler
          sleep 20
          publish_one tpt-telemetry-core
          sleep 20
          publish_one tpt-syslog-server
          sleep 20
          publish_one tpt-inference
          sleep 20
          publish_one tpt-otlp
          sleep 20
          publish_one tpt-daemon

  docker:
    name: build & push image to GHCR
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/tpt-daemon
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Aggregate the per-crate changelogs into the release body.
          body: |
            Automated release for `${{ github.ref_name }}`.

            See the per-crate `CHANGELOG.md` files for details:
            - tpt-telemetry-schema
            - tpt-grok-engine
            - tpt-telemetry-compiler
            - tpt-telemetry-core
            - tpt-syslog-server
            - tpt-inference
            - tpt-otlp
            - tpt-daemon
          generate_release_notes: true
