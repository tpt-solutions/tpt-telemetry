# cargo-deny configuration — supply-chain policy for `tpt-telemetry`.
#
# CI runs `cargo deny --all-features check` on every push/PR
# (see `.github/workflows/ci.yml`). It enforces advisories, license allow-list,
# and dependency-ban rules. See SECURITY.md "Supply Chain".

[advisories]
version = 2
# Yanked crate versions are a supply-chain risk: warn so they surface without
# hard-failing the build (the committed `cargo-audit-baseline.json` records the
# advisory state at the 0.1.0 cut: 0 vulns / 203 deps).
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive license set used by this project and its transitive dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
# Warn (don't hard-fail) on any license outside the allow list, so a newly
# added permissive dependency is surfaced for review rather than red-barring the
# build until the allow list is updated.
unlicensed = "warn"

[bans]
# Multiple versions of the same crate inflate the supply chain; flag them.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
