{{- if and (not .Values.existingSecret) (gt (len .Values.secretEnv) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tpt-daemon.fullname" . }}-secrets
  labels:
    {{- include "tpt-daemon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
