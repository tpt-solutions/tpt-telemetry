[package]
name = "tpt-telemetry-compiler"
description = "build.rs codegen: .tpt-log schema AST -> zero-copy Rust parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-telemetry-compiler"
readme = "../README.md"
keywords = ["codegen", "parser", "telemetry", "logs", "zero-copy"]
categories = ["parsing", "development-tools", "text-processing"]
rust-version.workspace = true

[dependencies]
tpt-telemetry-schema = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
thiserror.workspace = true
serde = { workspace = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compile_bench"
harness = false
