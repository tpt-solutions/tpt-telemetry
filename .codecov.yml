# Codecov configuration for tpt-telemetry.
#
# CI produces a merged lcov report via `cargo llvm-cov` (see
# .github/workflows/coverage.yml). These settings tune how Codecov presents it.

codecov:
  require_ci_to_pass: false

coverage:
  status:
    # Workspace-wide target; fail PRs that drop overall coverage below this.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "target"
  - "fuzz"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
