# Prometheus scrape config for the docker-compose stack. Scrapes the tpt-daemon
# metrics endpoint (/metrics on 9464) and the otel-collector self-metrics
# (/metrics on 8889).

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: tpt-daemon
    static_configs:
      - targets: ["tpt-daemon:9464"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
