[package]
name = "tpt-telemetry-core"
description = "Core parsing runtime and streaming reader for tpt-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-telemetry-core"
readme = "../README.md"
keywords = ["telemetry", "logs", "parser", "streaming", "zero-alloc"]
categories = ["parsing", "text-processing", "command-line-utilities"]
rust-version.workspace = true

[dependencies]
tpt-telemetry-schema = { workspace = true }
tpt-grok-engine = { workspace = true }
tpt-telemetry-compiler = { workspace = true }

[features]
alloc-counter = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "e2e_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false
