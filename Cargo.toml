[workspace]
resolver = "2"
members = [
    "tpt-telemetry-schema",
    "tpt-grok-engine",
    "tpt-telemetry-compiler",
    "tpt-telemetry-core",
    "tpt-syslog-server",
    "tpt-inference",
    "tpt-otlp",
    "tpt-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telemetry"
homepage = "https://github.com/tpt-solutions/tpt-telemetry"
rust-version = "1.85"

[workspace.dependencies]
tpt-telemetry-schema = { path = "tpt-telemetry-schema", version = "0.1.0" }
tpt-grok-engine = { path = "tpt-grok-engine", version = "0.1.0" }
tpt-telemetry-compiler = { path = "tpt-telemetry-compiler", version = "0.1.0" }
tpt-telemetry-core = { path = "tpt-telemetry-core", version = "0.1.0" }
tpt-syslog-server = { path = "tpt-syslog-server", version = "0.1.0" }
tpt-inference = { path = "tpt-inference", version = "0.1.0" }
tpt-otlp = { path = "tpt-otlp", version = "0.1.0" }

 pest = "2.7"
 pest_derive = "2.7"
 thiserror = "1.0"
 serde = { version = "1.0", features = ["derive"] }
 tracing = "0.1"
 tracing-subscriber = "0.3"

# ---------------------------------------------------------------------------
# cargo-dist: cross-compiled release binaries + installers (Phase 18 deferred
# item). `cargo dist` reads this block to produce archives and shell/powershell
# installers for each target, and generates `.github/workflows/release.yml`.
#
# crates.io publishing is owned by `.github/workflows/publish.yml` (lockstep,
# dependency-ordered), so we disable cargo-dist's publish jobs here to avoid
# double-publishing. Run `cargo dist init` to (re)generate the workflow.
#
# Build locally with:  cargo dist build --artifact=local
# ---------------------------------------------------------------------------
[workspace.metadata.dist]
cargo-dist-version = "0.9.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
publish-jobs = false
pr-runner = "ubuntu-20.04"
release-branch = "main"

tracing = "0.1"
tracing-subscriber = "0.3"
