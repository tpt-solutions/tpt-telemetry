[package]
name = "tpt-daemon"
description = "Unified tpt-telemetry daemon: syslog ingest -> parse -> OTLP export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "tpt-daemon"
path = "src/main.rs"

[lib]
name = "tpt_daemon"
path = "src/lib.rs"

[dependencies]
tpt-syslog-server = { workspace = true }
tpt-telemetry-core = { workspace = true }
tpt-telemetry-compiler = { workspace = true }
tpt-telemetry-schema = { workspace = true }
tpt-otlp = { workspace = true, features = ["grpc"] }
serde = { workspace = true }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
ctrlc = "3"
anyhow = "1"

[dev-dependencies]
tpt-otlp = { workspace = true, features = ["grpc"] }
